<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelMug Text Controller</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">02 · WEBAPP + TAL</p>
    <h1>PixelMug Text Controller</h1>
    <p>Configure the text and display effect, then send it directly to your device.</p>

    <label>Text to display
      <input id="text" maxlength="60" value="Hello PixelMug">
    </label>
    <div class="grid">
      <label>Text size
        <select id="font-size">
          <option value="SMALL">Small</option>
          <option value="MEDIUM" selected>Medium</option>
          <option value="LARGE">Large</option>
        </select>
      </label>
      <label>Text color
        <input id="color" type="color" value="#00ff00">
      </label>
      <label>Scroll direction
        <select id="direction">
          <option value="1">Right to left</option>
          <option value="2">Left to right</option>
          <option value="3">Bottom to top</option>
          <option value="4">Top to bottom</option>
        </select>
      </label>
      <label>Scroll delay <span id="speed-value">80</span>
        <input id="speed" type="range" min="10" max="200" value="80">
      </label>
    </div>
    <label class="check">
      <input id="scroll" type="checkbox" checked>
      <span>Enable scrolling<small>When disabled, the text remains still. A larger delay makes scrolling slower.</small></span>
    </label>
    <button id="send" class="primary" disabled>Display on PixelMug</button>
    <p id="status" role="status">Loading connected devices...</p>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
