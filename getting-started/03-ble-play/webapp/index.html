<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelMug Light Dot Controller</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">03 · WEBAPP + BLE + MPY</p>
    <h1>PixelMug Light Dot Controller</h1>
    <p>Drag to move the light dot and tap to create sparks.</p>
    <button id="install-mpy" class="secondary">Install MPY to device</button>
    <button id="connect" class="primary" aria-live="polite">Connect to PixelMug</button>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="pad" aria-label="Light dot touchpad"><span id="dot"></span></div>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
