<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word By</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="card">
    <h1>Word By</h1>

    <form id="word-form">
      <label for="text">Enter two characters or two words</label>
      <input id="text" name="text" value="Hi" autocomplete="off">

      <div class="devices">
        <section class="device-card">
          <h2 id="device-1">First device</h2>

          <label for="size-1">Text size</label>
          <select id="size-1">
            <option value="LARGE">Large</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="SMALL">Small</option>
          </select>

          <label for="color-1">Color</label>
          <select id="color-1">
            <option value="#ff0000">Red</option>
            <option value="#00ff00" selected>Green</option>
            <option value="#0000ff">Blue</option>
          </select>
        </section>

        <section class="device-card">
          <h2 id="device-2">Second device</h2>

          <label for="size-2">Text size</label>
          <select id="size-2">
            <option value="LARGE">Large</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="SMALL">Small</option>
          </select>

          <label for="color-2">Color</label>
          <select id="color-2">
            <option value="#ff0000">Red</option>
            <option value="#00ff00" selected>Green</option>
            <option value="#0000ff">Blue</option>
          </select>
        </section>
      </div>

      <button type="submit" disabled>Display</button>
    </form>

    <p id="status" aria-live="polite">Loading bound devices…</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
