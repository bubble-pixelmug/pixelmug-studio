<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pixel Text Share</title>
  <link rel="stylesheet" href="./src/style.css">
  <script>
    if (!globalThis.JeeWeb) {
      const jeeScript = document.createElement('script');
      jeeScript.src = 'jeesdk://jeeweb.js';
      document.head.appendChild(jeeScript);
    }
  </script>
</head>
<body>
  <main class="card">
    <h1>Pixel Text Share</h1>

    <form id="text-form">
      <label for="text">Text to display</label>
      <input id="text" name="text" value="Hello" maxlength="20" autocomplete="off">

      <div class="settings">
        <label>
          Color
          <select id="color">
            <option value="#ff0000">Red</option>
            <option value="#00ff00" selected>Green</option>
            <option value="#0000ff">Blue</option>
          </select>
        </label>

        <label>
          Text size
          <select id="size">
            <option value="LARGE">Large</option>
            <option value="MEDIUM" selected>Medium</option>
            <option value="SMALL">Small</option>
          </select>
        </label>

        <label>
          Scroll direction
          <select id="direction">
            <option value="0" selected>Static</option>
            <option value="1">Scroll left</option>
          </select>
        </label>
      </div>

      <p class="target-title">Send to</p>
      <div class="devices">
        <label class="device-option">
          <input type="radio" name="device" value="1" disabled>
          <span id="device-1">Slot 1 is unbound</span>
        </label>

        <label class="device-option">
          <input type="radio" name="device" value="2" disabled>
          <span id="device-2">Slot 2 is unbound</span>
        </label>
      </div>

      <button type="submit" disabled>Send</button>
    </form>

    <p id="status" aria-live="polite">Connecting to the Bubble app…</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
