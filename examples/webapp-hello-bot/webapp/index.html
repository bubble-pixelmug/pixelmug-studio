<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello WebApp</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">WebApp and Bot communication</p>
    <h1>Hello, Bubble!</h1>
    <p class="description">Enter a name and ask the Bot for a greeting.</p>

    <form id="hello-form">
      <label for="name">Name</label>
      <input id="name" name="name" value="PixelMug" autocomplete="name">
      <button type="submit">Send greeting</button>
    </form>

    <p id="result" class="result" aria-live="polite">Waiting to send</p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
