<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelMug Display Control</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <main class="card">
    <p class="eyebrow">Direct device RPC from a WebApp</p>
    <h1>PixelMug Display Control</h1>
    <p id="device" class="device">Loading bound device…</p>

    <div class="actions">
      <button id="turn-on" type="button" disabled>Turn on display</button>
      <button id="turn-off" type="button" class="secondary" disabled>Turn off display</button>
    </div>

    <p id="status" class="status" aria-live="polite"></p>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
