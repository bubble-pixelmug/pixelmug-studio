<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLE Simple Motion</title>
  <link rel="stylesheet" href="./src/style.css">
</head>
<body>
  <div class="connection">
    <button id="install-mpy" type="button">Install MPY</button>
    <button id="connect" type="button" disabled>Connect Bluetooth</button>
    <span id="connection-status">Bind a PixelMug, then install MPY.</span>
  </div>

  <main>
    <div><span>ax</span><output id="ax">0.000</output><small>g</small></div>
    <div><span>ay</span><output id="ay">0.000</output><small>g</small></div>
    <div><span>az</span><output id="az">0.000</output><small>g</small></div>
    <div><span>gx</span><output id="gx">0.0</output><small>°/s</small></div>
    <div><span>gy</span><output id="gy">0.0</output><small>°/s</small></div>
    <div><span>gz</span><output id="gz">0.0</output><small>°/s</small></div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
