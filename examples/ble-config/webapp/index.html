<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BLE Configuration Uploader</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <p class="eyebrow">BLE CONFIGURATION</p>
    <h1>BLE Configuration Uploader</h1>
    <p>Five data types are prefilled. Connect to a PixelMug, then send the configuration.</p>
    <div class="actions">
      <button id="install-mpy" type="button" class="secondary">Install MPY to device</button>
      <button id="connect" type="button" class="primary" disabled>Connect to PixelMug</button>
    </div>
    <p id="status" role="status" aria-live="polite">Bind a PixelMug, then install MPY.</p>
    <form>
      <fieldset disabled>
        <label>config1 · number <input name="config1" type="number" value="42" step="any" required></label>
        <label>config2 · string <input name="config2" value="hello" maxlength="128" pattern="[ -~]*"></label>
        <label>config3 · boolean
          <select name="config3">
            <option value="true" selected>true</option>
            <option value="false">false</option>
          </select>
        </label>
        <label>config4 · array (JSON)
          <textarea name="config4" rows="2" maxlength="128" required>[1, 2, 3]</textarea>
        </label>
        <label>config5 · object (JSON)
          <textarea name="config5" rows="3" maxlength="128" required>{"x": 1, "y": 2}</textarea>
        </label>
        <button id="send" type="submit">Send to PixelMug</button>
      </fieldset>
    </form>
  </main>
  <script type="module" src="./main.js"></script>
</body>
</html>
