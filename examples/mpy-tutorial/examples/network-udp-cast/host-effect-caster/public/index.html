<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelMug UDP Cast</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PIXELMUG · UDP</p>
      <h1>Effect Casting</h1>
      <p>Generate 32×16 pixel animations on the host and cast them to PixelMug over LAN UDP.</p>
    </header>

    <section class="panel target-panel">
      <div>
        <h2>Device Address</h2>
        <p>Enter the PixelMug LAN IP shown in the Studio device card.</p>
      </div>
      <div class="target-fields">
        <label>PixelMug IP<input id="device-ip" inputmode="decimal" placeholder="Example: 172.16.30.102"></label>
        <label>UDP Port<input id="udp-port" type="number" min="1" max="65535" value="9001"></label>
      </div>
    </section>

    <section class="preview-panel">
      <canvas id="preview" width="32" height="16" aria-label="PixelMug frame preview"></canvas>
      <div class="cast-state">
        <span id="status-dot"></span>
        <strong id="status-text">Casting has not started</strong>
        <span id="stats">0 frames</span>
      </div>
    </section>

    <section class="panel">
      <div class="section-title">
        <div>
          <h2>Choose an Effect</h2>
          <p>Click an effect to start casting immediately.</p>
        </div>
        <div class="transport-buttons">
          <button id="pause" type="button">Pause</button>
          <button id="stop" class="stop-button" type="button">Stop and Clear</button>
        </div>
      </div>
      <div id="effects" class="effects"></div>
    </section>

    <section class="panel controls">
      <label>
        <span>Brightness <output id="brightness-value">80%</output></span>
        <input id="brightness" type="range" min="10" max="100" value="80">
      </label>
      <label>
        <span>Speed <output id="speed-value">1.0×</output></span>
        <input id="speed" type="range" min="50" max="200" value="100">
      </label>
    </section>

    <p id="error" role="alert"></p>
  </main>
  <script type="module" src="/main.js"></script>
</body>
</html>
